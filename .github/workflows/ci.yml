name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: E2E profile（min/net/wifi）
        required: false
        default: net

env:
  ZIG_VERSION: "0.17.1"

jobs:
  host:
    name: host tests + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt --check
        run: scripts/check-fmt.sh
      - name: host test matrix
        run: scripts/check-host.sh
      - name: unit coverage gate (module reachability + baselines)
        run: |
          mkdir -p reports
          python3 scripts/check-coverage.py            # 人读表 + 门禁退出码直传
          python3 scripts/check-coverage.py --json > reports/coverage.json

  image:
    name: cross build + two-segment image
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install esptool
        run: pip install esptool==5.6.0
      - name: Build firmware image and assert two segments
        run: scripts/build-image.sh firmware

  e2e:
    name: e2e (profiles + two-segment images)
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install esptool
        run: pip install esptool==5.6.0
      - name: "Run host e2e (profiles: min/net/wifi, xfail tls)"
        run: |
          mkdir -p reports
          ESPTOOL="python -m esptool" python3 tests/e2e/run_e2e.py --host --junit reports/e2e-host.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/

  board:
    # 自托管 runner（标签 self-hosted, s31），不参与合并门禁；手动触发。
    # runner 前置：zig 0.17.1 在 PATH、idf-bootstrap/build 已生成、板子在 /dev/ttyUSB1。
    name: board self-check (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, s31]
    env:
      ESPTOOL: python -m esptool
    steps:
      - uses: actions/checkout@v4
      - name: install python deps
        run: pip install pyserial esptool==5.6.0
      - name: board e2e (build + flash + capture + assert)
        run: |
          python3 tests/e2e/run_e2e.py --board --profile "${{ github.event.inputs.profile }}" \
            --junit reports/e2e-board.xml
