name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: E2E profile（net-wire 为发布前门禁；min/net/wifi 仅冒烟）
        required: false
        default: net-wire
      gate:
        description: 走发布前门禁（host 预置 → gate-board.sh → 收尾）；关闭则只跑裸 e2e
        type: boolean
        required: false
        default: true
      demo:
        description: 跑 C8 A/B 演示（构建→烧录→断言→切槽→切回旧版本）；不碰网络，可与 gate 同时开
        type: boolean
        required: false
        default: false

env:
  ZIG_VERSION: "0.17.1"

jobs:
  host:
    name: host tests + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: workflow YAML lint
        run: python3 scripts/check-yaml.py
      - name: repo invariants (single app identity / start path)
        run: python3 scripts/check-invariants.py
      - name: zig fmt --check
        run: scripts/check-fmt.sh
      - name: host test matrix
        # 失败时把输出里失败工程的那几行放进注解：job 日志要管理员权限才读得到，注解匿名就能读
        # （check-runs API）。每一步最多 10 条注解，所以只取第一个失败工程的 9 行加末尾的汇总行。
        run: |
          rc=0
          scripts/check-host.sh > /tmp/check-host.log 2>&1 || rc=$?
          cat /tmp/check-host.log
          if [ "$rc" -ne 0 ]; then
            {
              awk '/^FAIL  /{ if (!p) { p = 1; c = 0 } } p && c < 9 { print; c++ }' /tmp/check-host.log
              grep -A 8 '^failed projects:' /tmp/check-host.log || true
            } > /tmp/check-host-annot.txt
            [ -s /tmp/check-host-annot.txt ] || tail -n 10 /tmp/check-host.log > /tmp/check-host-annot.txt
            sed -e 's/\r$//' -e 's/%/%25/g' -e 's/::/%3A%3A/g' /tmp/check-host-annot.txt | head -n 10 \
              | while IFS= read -r line; do
                  echo "::error title=host test matrix failed::${line:0:3800}"
                done
          fi
          exit "$rc"
      - name: unit coverage gate (module reachability + baselines)
        run: |
          mkdir -p reports
          python3 scripts/check-coverage.py            # 人读表 + 门禁退出码直传
          python3 scripts/check-coverage.py --json > reports/coverage.json

  image:
    name: cross build + two-segment image
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install esptool
        run: pip install esptool==5.6.0
      - name: Build firmware image and assert two segments
        run: scripts/build-image.sh firmware

  e2e:
    name: e2e (profiles + two-segment images)
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install esptool
        run: pip install esptool==5.6.0
      # 名字曾写着 "profiles: min/net/wifi, xfail tls" —— 那是 tls 还编不过时的口径。
      # 现在这条命令不带 --profile，`--host` 会跑**全部** profile（min/net/wifi/tls/net-wire/full），
      # 且 tls 早已通过（本地 `--board --profile tls` 也是 PASS），所以不再有 xfail。
      - name: "Run host e2e (all profiles)"
        run: |
          mkdir -p reports
          ESPTOOL="python -m esptool" python3 tests/e2e/run_e2e.py --host --junit reports/e2e-host.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/

  board:
    # 自托管 runner（标签 self-hosted, s31），不参与合并门禁；手动触发。
    # runner 前置：zig 0.17.1 在 PATH、idf-bootstrap/build 已生成、板子在 /dev/ttyUSB1
    # （或用 BOARD 指定，例如重新枚举后的 /dev/ttyUSB0）、sudo 免密。
    # 默认走 scripts/gate-board.sh：host 预置 + 删旧日志 + 证据断言 + junit skipped 判失败，
    # 与本地发布前门禁同一套入口（R4.1）。
    name: board self-check (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, s31]
    env:
      ESPTOOL: python3 -m esptool
    steps:
      - uses: actions/checkout@v4
      - name: install python deps
        run: python3 -m pip install pyserial esptool==5.6.0
      - name: ensure idf-bootstrap build
        run: |
          if [ ! -f firmware/idf-bootstrap/build/flash_args ]; then
            ( cd firmware/idf-bootstrap \
              && idf.py --preview set-target esp32s31 \
              && idf.py build )
          fi
      - name: board gate (host prep → gate-board.sh → cleanup)
        if: ${{ github.event.inputs.gate != 'false' }}
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          set -euo pipefail
          sudo scripts/host-prep-wire.sh up
          trap 'sudo scripts/host-prep-wire.sh down' EXIT
          scripts/gate-board.sh
      # C8：A/B 九项断言由机器复检，不再靠人记得手跑。
      # 用 `always()`：gate 因主机前置缺失而失败时（例如没跑过 host-prep 的 runner），
      # A/B 仍然值得验 —— 它不需要 DHCP/防火墙，且第一步就会把 factory 刷成默认镜像，
      # 不依赖上一步留下什么状态。
      # 与 gate/e2e **同一个 job ⇒ 天然串行**，不会两个进程抢同一个串口。
      # demo 的最后一步会写回默认固件并清 otadata/计数扇区，所以跑完板子仍是干净的。
      - name: A/B demo (build → flash → assert → stage → revert)
        if: ${{ always() && github.event.inputs.demo == 'true' }}
        run: |
          set -euo pipefail
          scripts/demo-board.sh "${BOARD:-}"

      - name: board e2e (raw, gate disabled)
        if: ${{ github.event.inputs.gate == 'false' }}
        run: |
          python3 tests/e2e/run_e2e.py --board --profile "${{ github.event.inputs.profile }}" \
            --junit reports/e2e-board.xml
